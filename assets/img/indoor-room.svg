<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Indoor setup, seen from the side</title>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff4c9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="proj" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb3ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8fb3ff" stop-opacity="0.04"/>
    </linearGradient>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M5 0 V10" stroke="#c8f542" stroke-width="2"/>
    </marker>
  </defs>

  <!-- room -->
  <rect width="1000" height="600" fill="#1b1d1f"/>
  <line x1="30" y1="60" x2="970" y2="60" stroke="#3a3e42" stroke-width="3"/>
  <line x1="30" y1="420" x2="970" y2="420" stroke="#3a3e42" stroke-width="3"/>
  <text x="36" y="46" fill="#9aa0a6" font-size="20">Ceiling</text>

  <!-- projector and its throw onto the screen -->
  <polygon points="242,92 860,92 860,404" fill="url(#proj)"/>
  <rect x="196" y="78" width="46" height="26" rx="5" fill="#2a2d30" stroke="#5a5f64" stroke-width="2"/>
  <line x1="219" y1="60" x2="219" y2="78" stroke="#5a5f64" stroke-width="3"/>
  <circle cx="242" cy="91" r="6" fill="#8fb3ff"/>
  <text x="219" y="134" fill="#9aa0a6" font-size="20" text-anchor="middle">Projector</text>

  <!-- screen -->
  <rect x="860" y="84" width="12" height="336" fill="#d9dde2"/>
  <text x="0" y="0" fill="#ecedee" font-size="24" font-weight="600" text-anchor="middle" transform="translate(906 252) rotate(-90)">Screen or net</text>

  <!-- track light: a rail on the ceiling with heads aimed straight down over the ball and its path -->
  <line x1="410" y1="68" x2="650" y2="68" stroke="#7a8086" stroke-width="6" stroke-linecap="round"/>
  <polygon points="440,96 520,96 560,418 400,418" fill="url(#beam)"/>
  <polygon points="560,96 640,96 690,418 510,418" fill="url(#beam)"/>
  <rect x="464" y="68" width="32" height="30" rx="4" fill="#d9dde2"/>
  <rect x="584" y="68" width="32" height="30" rx="4" fill="#d9dde2"/>
  <path d="M396 222 L 446 222 L 470 102" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <text x="386" y="196" fill="#ecedee" font-size="26" font-weight="700" text-anchor="end">Track light</text>
  <text x="386" y="228" fill="#ecedee" font-size="26" font-weight="700" text-anchor="end">aimed down</text>
  <text x="386" y="258" fill="#9aa0a6" font-size="21" text-anchor="end">on the ball's path</text>

  <!-- mat, ball and flight -->
  <rect x="400" y="410" width="150" height="10" rx="2" fill="#3f6b35"/>
  <path d="M480 404 Q 680 160 860 210" fill="none" stroke="#ecedee" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="480" cy="404" r="8" fill="#ffffff"/>
  <text x="392" y="414" fill="#9aa0a6" font-size="20" text-anchor="end">Mat</text>

  <!-- tripod and phone, directly behind the ball -->
  <line x1="120" y1="300" x2="90" y2="420" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="300" x2="150" y2="420" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="300" x2="120" y2="420" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/>
  <rect x="111" y="252" width="18" height="50" rx="4" fill="#c8f542"/>
  <path d="M129 264 L 470 398" stroke="#c8f542" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <text x="120" y="164" fill="#ecedee" font-size="26" font-weight="700" text-anchor="middle">iPhone or</text>
  <text x="120" y="196" fill="#ecedee" font-size="26" font-weight="700" text-anchor="middle">iPad on</text>
  <text x="120" y="228" fill="#ecedee" font-size="26" font-weight="700" text-anchor="middle">a tripod</text>

  <!-- dimensions -->
  <g stroke="#c8f542" stroke-width="2.5">
    <line x1="120" y1="466" x2="480" y2="466" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="480" y1="466" x2="860" y2="466" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="120" y1="426" x2="120" y2="474" stroke-dasharray="3 4" stroke-width="1.5"/>
    <line x1="480" y1="426" x2="480" y2="474" stroke-dasharray="3 4" stroke-width="1.5"/>
    <line x1="860" y1="426" x2="860" y2="474" stroke-dasharray="3 4" stroke-width="1.5"/>
  </g>
  <text x="300" y="512" fill="#c8f542" font-size="32" font-weight="700" text-anchor="middle">7.5 ft (2.3 m)</text>
  <text x="300" y="544" fill="#9aa0a6" font-size="22" text-anchor="middle">to the ball</text>
  <text x="670" y="512" fill="#c8f542" font-size="32" font-weight="700" text-anchor="middle">8 ft (2.4 m) +</text>
  <text x="670" y="544" fill="#9aa0a6" font-size="22" text-anchor="middle">ball to screen</text>
  <text x="670" y="574" fill="#9aa0a6" font-size="22" text-anchor="middle">10 ft (3 m) is comfortable</text>
</svg>
